name: Agentic Docs Sync

on:
  push:
    paths:
      - 'copilotWebRelay/**'
  pull_request:
    paths:
      - 'copilotWebRelay/**'

jobs:
  agentic-docs-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GitHub Agentic Workflow CLI
        run: npm install -g @github/gh-aw

      - name: Run Agentic Workflow (docs sync)
        run: |
          gh-aw run --source ./copilotWebRelay --docs ./copilotWebRelay/docs

      - name: Commit and push docs changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./copilotWebRelay/docs
          git diff --cached --quiet || git commit -m 'docs: auto-update by Agentic Workflow'
          git push
